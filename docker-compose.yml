services:
  db:
    image: postgres:16-alpine
    container_name: foodplus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodplus
      POSTGRES_PASSWORD: foodplus_dev_password
      POSTGRES_DB: foodplus
    ports:
      - "5432:5432"
    volumes:
      - foodplus-pgdata:/var/lib/postgresql/data

volumes:
  foodplus-pgdata:
